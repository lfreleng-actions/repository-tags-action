---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 3 # Increase this timeout value as needed
    steps:
      # Test local action
      - name: "Run action: ${{ github.repository }}"
        id: test-local
        uses: $/

      # Test local action
      - name: "Run action: ${{ github.repository }} [test-tags-semver]"
        id: semver
        uses: $/
        with:
          repository: 'lfreleng-actions/test-tags-semantic'
          path: 'test-tags-semantic'

      # Test local action
      - name: "Run action: ${{ github.repository }} [test-tags-calver]"
        id: calver
        uses: $/
        with:
          repository: 'lfreleng-actions/test-tags-calver'
          path: 'test-tags-calver'

      - name: "Validate action: ${{ github.repository }}"
        shell: bash
        run: |
          # Validate Action Output
          errors='false'
          if [ "${STEPS_SEMVER_OUTPUTS_TAG}" != 'v0.1.1' ]; then
            echo 'Error: did not get expected semantic tag result ❌'
            echo "Returned: ${STEPS_SEMVER_OUTPUTS_TAG}"
            echo 'Expected: v0.1.1'
            errors='true'
          fi
          if [ "${STEPS_SEMVER_OUTPUTS_TAG_COUNT}" != '2' ]; then
            echo 'Error: did not get expected semver count ❌'
            echo "Returned: ${STEPS_SEMVER_OUTPUTS_TAG_COUNT}"
            echo 'Expected: 2'
            errors='true'
          fi
          if [ "${STEPS_CALVER_OUTPUTS_TAG}" != '2025.02.01' ]; then
            echo 'Error: did not get expected calver tag result ❌'
            echo "Returned: ${STEPS_CALVER_OUTPUTS_TAG}"
            echo 'Expected: 2025.02.01'
            errors='true'
          fi
          if [ "${STEPS_CALVER_OUTPUTS_TAG_COUNT}" != '2' ]; then
            echo 'Error: did not get expected calver count ❌'
            echo "Returned: ${STEPS_CALVER_OUTPUTS_TAG_COUNT}"
            echo 'Expected: 2'
            errors='true'
          fi

          # Default inputs: this repository's tags change over time, so
          # check the outputs' consistency rather than exact values.
          # The default 'path' is '.', so the checkout and its tags must
          # be at the workspace root, where this step runs.
          expected_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          origin_url=$(git config --get remote.origin.url || true)
          if [ "${origin_url%.git}" != "$expected_url" ]; then
            echo 'Error: default inputs did not check out this repository ❌'
            echo "Returned: ${origin_url}"
            echo "Expected: ${expected_url}"
            errors='true'
          fi
          if ! [[ "${STEPS_LOCAL_OUTPUTS_TAG_COUNT}" =~ ^[0-9]+$ ]]; then
            echo 'Error: default inputs tag count is not an integer ❌'
            echo "Returned: ${STEPS_LOCAL_OUTPUTS_TAG_COUNT}"
            errors='true'
          elif [ "${STEPS_LOCAL_OUTPUTS_TAG_COUNT}" = '0' ]; then
            if [ -n "${STEPS_LOCAL_OUTPUTS_TAG}" ]; then
              echo 'Error: default inputs returned a tag but no count ❌'
              echo "Returned: ${STEPS_LOCAL_OUTPUTS_TAG}"
              errors='true'
            fi
          elif [ -z "${STEPS_LOCAL_OUTPUTS_TAG}" ]; then
            echo 'Error: default inputs counted tags but returned none ❌'
            echo "Tag count: ${STEPS_LOCAL_OUTPUTS_TAG_COUNT}"
            errors='true'
          else
            tag="${STEPS_LOCAL_OUTPUTS_TAG}"
            if ! git rev-parse -q --verify "refs/tags/${tag}" > /dev/null
            then
              echo 'Error: default inputs tag not in workspace root ❌'
              echo "Returned: ${tag}"
              errors='true'
            fi
            if [ "${STEPS_LOCAL_OUTPUTS_NUMERIC_TAG}" != "${tag#[vV]}" ]
            then
              echo 'Error: default inputs numeric tag does not match ❌'
              echo "Returned: ${STEPS_LOCAL_OUTPUTS_NUMERIC_TAG}"
              echo "Expected: ${tag#[vV]}"
              errors='true'
            fi
            if [ "${STEPS_LOCAL_OUTPUTS_SEMANTIC}" != 'true' ] && \
              [ "${STEPS_LOCAL_OUTPUTS_CALVER}" != 'true' ]; then
              echo 'Error: default inputs tag is neither semver nor calver ❌'
              echo "Returned: ${tag}"
              errors='true'
            fi
          fi

          if [ "$errors" == 'true' ]; then
            echo 'Action validation failed ❌'
            exit 1
          else
            echo 'Action validation passed ✅'
          fi
        env:
          STEPS_SEMVER_OUTPUTS_TAG: ${{ steps.semver.outputs.tag }}
          STEPS_SEMVER_OUTPUTS_TAG_COUNT: ${{ steps.semver.outputs.tag_count }}
          STEPS_CALVER_OUTPUTS_TAG: ${{ steps.calver.outputs.tag }}
          STEPS_CALVER_OUTPUTS_TAG_COUNT: ${{ steps.calver.outputs.tag_count }}
          STEPS_LOCAL_OUTPUTS_TAG: ${{ steps.test-local.outputs.tag }}
          # yamllint disable-line rule:line-length
          STEPS_LOCAL_OUTPUTS_TAG_COUNT: ${{ steps.test-local.outputs.tag_count }}
          # yamllint disable-line rule:line-length
          STEPS_LOCAL_OUTPUTS_NUMERIC_TAG: ${{ steps.test-local.outputs.numeric_tag }}
          STEPS_LOCAL_OUTPUTS_SEMANTIC: ${{ steps.test-local.outputs.semantic }}
          STEPS_LOCAL_OUTPUTS_CALVER: ${{ steps.test-local.outputs.calver }}

  ### Regression test: conflicting local tag (issue #147) ###
  tests-tag-clobber:
    name: "Test local GitHub Action [tag clobber]"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 3 # Increase this timeout value as needed
    steps:
      # First run populates the local tags in the target path
      - name: "Run action: prepare [test-tags-semver]"
        uses: $/
        with:
          repository: 'lfreleng-actions/test-tags-semantic'
          path: 'test-tags-clobber'

      # Replace annotated tag v0.1.1 with a lightweight tag at its commit,
      # as actions/checkout before v6.0.2 did on a tag push. A plain
      # 'git fetch --tags' then fails with 'would clobber existing tag'.
      - name: "Create conflicting local tag"
        shell: bash
        working-directory: 'test-tags-clobber'
        run: |
          # Create conflicting local tag
          git tag -f v0.1.1 'v0.1.1^{commit}'
          dry_run=$(git fetch --tags --dry-run 2>&1 || true)
          echo "$dry_run"
          if ! echo "$dry_run" | grep -q 'would clobber existing tag'; then
            echo 'Error: failed to create a conflicting local tag ❌'
            exit 1
          fi

      # Second run reuses the path, so the conflicting tag is present
      - name: "Run action: ${{ github.repository }} [tag clobber]"
        id: clobber
        uses: $/
        with:
          repository: 'lfreleng-actions/test-tags-semantic'
          path: 'test-tags-clobber'

      - name: "Validate action: ${{ github.repository }} [tag clobber]"
        shell: bash
        working-directory: 'test-tags-clobber'
        run: |
          # Validate Action Output
          errors='false'
          if [ "${STEPS_CLOBBER_OUTPUTS_TAG_COUNT}" != '2' ]; then
            echo 'Error: did not get expected semver count ❌'
            echo "Returned: ${STEPS_CLOBBER_OUTPUTS_TAG_COUNT}"
            echo 'Expected: 2'
            errors='true'
          fi
          if [ "${STEPS_CLOBBER_OUTPUTS_TAG}" != 'v0.1.1' ]; then
            echo 'Error: did not get expected semantic tag result ❌'
            echo "Returned: ${STEPS_CLOBBER_OUTPUTS_TAG}"
            echo 'Expected: v0.1.1'
            errors='true'
          fi
          local_ref=$(git rev-parse refs/tags/v0.1.1)
          remote_ref=$(git ls-remote origin refs/tags/v0.1.1 | cut -f1)
          if [ "$local_ref" != "$remote_ref" ]; then
            echo 'Error: local tag v0.1.1 does not match the remote ❌'
            echo "Local: $local_ref"
            echo "Remote: $remote_ref"
            errors='true'
          fi

          if [ "$errors" == 'true' ]; then
            echo 'Action validation failed ❌'
            exit 1
          else
            echo 'Action validation passed ✅'
          fi
        env:
          STEPS_CLOBBER_OUTPUTS_TAG: ${{ steps.clobber.outputs.tag }}
          # yamllint disable-line rule:line-length
          STEPS_CLOBBER_OUTPUTS_TAG_COUNT: ${{ steps.clobber.outputs.tag_count }}
